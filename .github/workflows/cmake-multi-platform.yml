name: CMake on multiple platforms

on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,  compiler: gcc-14 }
          - { os: ubuntu-24.04,  compiler: llvm-23, cxxflags: -stdlib=libc++ }
          - { os: macos-latest,  compiler: llvm-23 }
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    env:
      CXXFLAGS: ${{ matrix.cxxflags }}
    steps:
      - uses: actions/checkout@v5
      - uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true
      - run: cmake --workflow --preset ci

  asan:
    name: sanitizers (ASan + UBSan)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: llvm-23 }
          - { os: macos-latest, compiler: llvm-23 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true
      - run: cmake --workflow --preset asan

  lint:
    name: clang-format / clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-23
          clang-format: 23
          clang-tidy: 23
          cmake: true
          ninja: true
      - run: cmake --preset debug
      - run: cmake --build --preset format-check
      - run: cmake --workflow --preset lint
